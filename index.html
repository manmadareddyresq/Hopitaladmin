<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResQ – Hospital Admin Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --primary: #0d6efd;
      --primary-light: #e7f1ff;
      --success: #198754;
      --warning: #ffc107;
      --danger: #dc3545;
      --dark: #212529;
      --gray-100: #f8f9fa;
      --gray-200: #e9ecef;
      --gray-300: #dee2e6;
      --gray-400: #ced4da;
      --gray-500: #adb5bd;
      --gray-600: #6c757d;
      --gray-700: #495057;
      --gray-800: #343a40;
      --gray-900: #212529;
      --shadow-sm: 0 0.25rem 0.7rem rgba(0, 0, 0, 0.05);
      --shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 1rem 3rem rgba(0, 0, 0, 0.15);
      --radius: 0.5rem;
      --radius-sm: 0.3rem;
      --radius-lg: 0.8rem;
      --transition: all 0.2s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background-color: #f4f6f9;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* LOGIN SCREEN */
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #0d6efd, #0b5ed7);
      padding: 1rem;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 1rem;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .login-header {
      padding: 1.5rem 1.5rem 1rem;
      background: #0d6efd;
      color: #fff;
      text-align: center;
    }

    .login-header h2 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .login-body {
      padding: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      color: #495057;
      margin-bottom: 0.4rem;
    }

    .form-control {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ced4da;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      transition: border 0.2s;
    }

    .form-control:focus {
      outline: none;
      border-color: #0d6efd;
      box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.25);
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-primary {
      background: #0d6efd;
      color: #fff;
    }

    .btn-primary:hover {
      background: #0b5ed7;
    }

    /* MAIN LAYOUT */
    .app {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1.5rem;
      background: #ffffff;
      border-bottom: 1px solid #dee2e6;
      box-shadow: var(--shadow-sm);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 700;
      color: #0d6efd;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #0d6efd;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }

    .sidebar {
      width: 240px;
      background: #212529;
      color: #adb5bd;
      padding: 1rem 0;
    }

    .sidebar-brand {
      padding: 0.8rem 1.2rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: #f8f9fa;
      border-left: 3px solid #0d6efd;
    }

    .sidebar-menu {
      list-style: none;
      margin-top: 0.8rem;
    }

    .sidebar-menu a {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.75rem 1.2rem;
      border-radius: 0 1rem 1rem 0;
      color: #adb5bd;
      font-size: 0.9rem;
      transition: var(--transition);
    }

    .sidebar-menu a:hover,
    .sidebar-menu a.active {
      background: #343a40;
      color: #f8f9fa;
    }

    .sidebar-menu a.active {
      border-left: 3px solid #0d6efd;
    }

    .sidebar-toggle {
      display: none;
      background: transparent;
      border: none;
      color: #adb5bd;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .main-content {
      flex: 1;
      display: flex;
    }

    .content {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
    }

    .card {
      background: #ffffff;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 1.2rem;
      margin-bottom: 1.2rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #212529;
      margin-bottom: 0.8rem;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.2rem;
    }

    .stat-card {
      background: #ffffff;
      border-radius: var(--radius);
      padding: 0.9rem 1.1rem;
      border: 1px solid #dee2e6;
      box-shadow: var(--shadow-sm);
    }

    .stat-label {
      font-size: 0.85rem;
      color: #6c757d;
      margin-bottom: 0.2rem;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: #212529;
    }

    .stat-trend {
      font-size: 0.8rem;
      color: var(--success);
      margin-top: 0.3rem;
    }

    .chart-container {
      height: 280px;
      margin-bottom: 1.2rem;
    }

    .table-responsive {
      overflow-x: auto;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .table th {
      background: #f4f6f9;
      padding: 0.7rem 0.8rem;
      text-align: left;
      font-weight: 600;
      color: #495057;
      border-bottom: 1px solid #dee2e6;
    }

    .table td {
      padding: 0.7rem 0.8rem;
      border-bottom: 1px solid #dee2e6;
    }

    .table tr:last-child td {
      border-bottom: none;
    }

    .badge {
      padding: 0.3rem 0.6rem;
      border-radius: 1rem;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-block;
    }

    .badge-success {
      background: #d1ecdb;
      color: #155724;
    }

    .badge-warning {
      background: #fff3cd;
      color: #856404;
    }

    .badge-danger {
      background: #f8d7da;
      color: #721c24;
    }

    .badge-secondary {
      background: #e9ecef;
      color: #495057;
    }

    .btn-sm {
      font-size: 0.8rem;
      padding: 0.3rem 0.6rem;
    }

    .action-buttons {
      display: flex;
      gap: 0.4rem;
    }

    .action-btn {
      width: 30px;
      height: 30px;
      border-radius: 0.3rem;
      border: none;
      background: #e9ecef;
      color: #495057;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .action-btn:hover {
      background: #0d6efd;
      color: #fff;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 0.4rem;
    }

    .status-dot.online {
      background: #198754;
    }

    .status-dot.offline {
      background: #6c757d;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .track-map {
      height: 150px;
      border-radius: var(--radius-sm);
      background: #f4f6f9;
      border: 1px dashed #ced4da;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: #6c757d;
    }

    .notification-item {
      display: flex;
      gap: 0.8rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid #dee2e6;
      font-size: 0.9rem;
      color: #495057;
    }

    .notification-item:last-child {
      border-bottom: none;
    }

    .notification-meta {
      font-size: 0.75rem;
      color: #6c757d;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .stats-row {
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      }
    }

    @media (max-width: 768px) {
      .login-container {
        padding: 0.5rem;
      }

      .topbar {
        padding: 0.7rem 1rem;
      }

      .topbar-right {
        gap: 0.6rem;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        z-index: 1000;
        transform: translateX(-100%);
        transition: transform 0.3s;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main-content {
        flex-direction: column;
      }

      .sidebar-toggle {
        display: block;
        margin-right: 0.8rem;
      }

      .app {
        overflow: hidden;
      }
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <h2>ResQ – Hospital Admin Portal</h2>
      </div>

        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="Password" />
        </div>
        <button id="loginBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Sign In
        </button>
      </div>
    </div>
  </div>

      <main class="content">

              <div class="stat-value">7.3 min</div>
              <div class="stat-trend">-0.5 min</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Completed Today</div>
              <div class="stat-value">24</div>
              <div class="stat
